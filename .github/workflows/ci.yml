name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter Analyze (errors + warnings)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Flutter version
        id: flutter_version
        shell: bash
        run: echo "version=$(tr -d '\n' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      # Intentionally NON-fatal on `info`-level lints: the upstream `main`
      # branch already carries pre-existing info findings (deprecated fields,
      # long lines). We only fail the build on real errors/warnings so the
      # gate catches regressions this PR would introduce, not upstream debt.
      - name: Analyze (fail on errors + warnings only)
        shell: bash
        run: |
          flutter analyze > analyze_output.txt 2>&1 || true
          echo "----- flutter analyze output -----"
          cat analyze_output.txt
          echo "----------------------------------"
          if grep -E "error ?•|warning ?•" analyze_output.txt; then
            echo "::error::flutter analyze reported errors or warnings"
            exit 1
          fi
          echo "No errors or warnings found."
